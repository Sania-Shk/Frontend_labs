<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Finder</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="profil.css" />
  </head>
  <body>
    <div class="container">
      <div class="logoSection">
        <div id="logo">
          <img src="assets/images/logo.JPG" class="main_logo" />
        </div>

        <h2>Dev Finder</h2>
      </div>

      <div class="searchSection">
        <div class="seacrhId">
          <div class="searchlogo">
            <img src="assets/images/search.svg" class="searchImg" />
          </div>
          <input
            type="text"
            id="userprofile"
            placeholder="Search Github Username.."
          />
        </div>
        <button id="btn">Search</button>
      </div>

      <div class="loading">
        <img src="assets/images/loadingimg.gif" class="loading_img" />
      </div>
    </div>
    <div class="Pfcontainer">
      <div class="left">
        <div class="introSection">
          <div class="userprofile">
            <img src="assets/images/logo.JPG" class="profilePic" />
          </div>
          <div class="useridentity">
            <h2 id="userName">San-Shk</h2>
            <h3 id="userId">san123</h3>
          </div>
        </div>

        <div class="detailSection">
          <p id="userBio">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque,
            quos?Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis,
            odit!
          </p>

          <div class="userfrnds">
            <img src="assets/images/group.svg" class="group" />
            <div id="follower" style="margin: 0px 2.3px">
              <span id="num" class="followernum">123</span>
              followers
            </div>
            <span style="margin: 0px 1.3px">|</span>
            <div id="following" style="margin: 0px 2.3px">
              <span id="num" class="followingnum">53</span>
              following
            </div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="joindate">
          <img src="assets/images/clock.svg" id="joineddate" />
          <h3 id="joined"></h3>
        </div>

        <div class="repoTotal">
          <div id="totalRepo"></div>
          <a href="#" class="repolink" target="_blank" rel="noopener noreferrer"
            >Github Page</a
          >
          <div class="userRepo"></div>
        </div>

        <div class="repoList">
          <!-- <div class="box">
              <div class="repohead">
                <img src="#" class="filelogo" />
                <h2 class="repotitle"></h2>
              </div>
              <div class="description"></div>
              <div class="language"></div>
            </div> -->
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
